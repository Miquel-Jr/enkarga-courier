<!--DISEÑO GENERAL DE LA VISTA-->
<form>
  <section id="listado">
    <!--TITULO DE LA VISTA-->
    <h3 class="h3-responsive titulo font-weight-bold">LISTAR DEPOSITOS</h3>

    <div class="form-row justify-content-center ">
      <div class="form-group col-md-3">
        <label class="col-form-label font-weight-bold" for="fechaInicio">Fecha Inicio</label>
        <input required id="fechaInicio" class="form-control" type="date" aria-describedby="fechaInicioHelp"
          placeholder="Ingresar fecha de inicio" />
        <small id="fechaInicioHelp" class="form-text text-muted">Ejemplo: 2024-01-01.</small>
      </div>
      <div class="form-group col-md-3">
        <label class="col-form-label font-weight-bold" for="fechaFin">Fecha Fin</label>
        <input required id="fechaFin" class="form-control" type="date" aria-describedby="fechaFinHelp"
          placeholder="Ingresar fecha fin" />
        <small id="fechaFinHelp" class="form-text text-muted">Ejemplo: 2024-01-01.</small>
      </div>
    </div>

    <div class="form-inline justify-content-center">
      <button type="button" onclick="mostrarDatosFacturasDeposito();return false" class="btn btn-guardar ">
        Filtrar
      </button>
      <button type="button" onclick="exportarExcel();return false" class="btn btn-success ml-2">
        Exportar a Excel
      </button>
    </div>

    <!--CONTENIDO PRINCIPAL DE LA VISTA-->
    <table id="tablaListado" class="table table-striped table-bordered" cellspacing="0" width="100%">
      <thead>
        <tr>
          <th>FACTURA</th>
          <th>FECHA DEPOSITO</th>
          <th>ENTIDAD BANCARIA</th>
          <th>FORMA DE PAGO</th>
          <th>NUMERO CENTRO</th>
          <th>NUMERO OPERACION</th>
          <th>FECHA REGISTRO</th>
          <th>ACCION</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
  </section>
</form>


<!-- Modal Editar Factura Deposito -->
<div class="modal fade" id="modalEditarFacturaDeposito" tabindex="-1" role="dialog"
  aria-labelledby="modalEditarFacturaDeposito" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header principal">
        <h5 class="modal-title white-text font-weight-bold">
          Informacion Factura Deposito
        </h5>
        <span id="deposito" class="badge badge-light badge-pill white-text font-weight-bold"></span>
        <span id="codigo" class="badge badge-light badge-pill white-text font-weight-bold d-none"></span>
        <button id="closeModal" type="button" class="close white-text font-weight-bold" data-dismiss="modal"
          aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">

          <!-- FECHA DEPOSITO -->
          <div class="col-12 col-md form-group">
            <label class="col-form-label font-weight-bold" for="fechaDeposito">Fecha Deposito</label>
            <input required id="fechaDeposito" class="form-control " type="date" aria-describedby="fechaDepositoHelp"
              placeholder="Ingresar fecha deposito" />
            <small id="fechaDepositoHelp" class="form-text text-muted">Campo obligatorio.</small>
          </div>

          <!-- ENTIDAD BANCARIA -->
          <div class="col-12 col-md form-group">
            <label class="col-form-label font-weight-bold" for="entidadBancaria">Entidad Bancaria</label>
            <select required id="entidadBancaria" class="form-control" aria-describedby="entidadBancariaHelp">
              <option value="BCP">BCP</option>
              <option value="BBVA">BBVA</option>
              <option value="SCOTIABANK">SCOTIABANK</option>
              <option value="INTERBANK">INTERBANK</option>
              <option value="MIBANCO">MIBANCO</option>
            </select>
            <small id="entidadBancariaHelp" class="form-text text-muted">Campo obligatorio.</small>
          </div>

          <!-- FORMA DE PAGO -->
          <div class="col-12 col-md form-group">
            <label class="col-form-label font-weight-bold" for="formaPago">Forma de Pago</label>
            <select required id="formaPago" class="form-control" aria-describedby="formaPagoHelp">
              <option value="TRANSFERENCIA">TRANSFERENCIA</option>
              <option value="DEPOSITO">DEPOSITO</option>
            </select>
            <small id="formaPagoHelp" class="form-text text-muted">Campo obligatorio.</small>
          </div>

          <div class="w-100"></div>

          <!-- NUMERO CENTRO -->
          <div class="col-12 col-md form-group">
            <label class="col-form-label font-weight-bold" for="numeroCentro">Numero Centro</label>
            <input required id="numeroCentro" class="form-control " type="number" aria-describedby="numeroCentroHelp"
              placeholder="Ingresar el numero centro de la operacion" />
            <small id="numeroCentroHelp" class="form-text text-muted">Campo obligatorio.</small>
          </div>

          <!-- NUMERO OPERACION -->
          <div class="col-12 col-md form-group">
            <label class="col-form-label font-weight-bold" for="numeroOperacion">Numero Operacion</label>
            <input required id="numeroOperacion" class="form-control" type="number"
              aria-describedby="numeroOperacionHelp" placeholder="Numero operacion de la factura" />
            <small id="numeroOperacionHelp" class="form-text text-muted">Campo obligatorio.</small>
          </div>

          <div class="w-100"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="actualizarFacturaDeposito"
          onclick="validarFormularioActualizarDeposito(); return false">
          Actualizar
        </button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>

<!--ARCHIVOS JS DE LA VISTA-->
<script type="text/javascript" src="Modulos/ModContabilidad/VistaContabilidad.js"></script>
<script type="text/javascript" src="Bootstrap/js/tablaDinamica.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/validator/13.6.0/validator.min.js"></script>
<!-- SheetJS para exportar a Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="text/javascript">


  // Column keys for export (same order as headers)
  var exportColumnKeys = ['factura', 'fecha_deposito', 'entidad_bancaria', 'forma_pago', 'numero_centro', 'numero_operacion', 'fecha_registro'];
  var tablaFacturas = null;

  /*=============================================
    - CARGAR FACTURAS DEPOSITO - DOCUMENTO
  =============================================*/

  $(document).ready(function () {
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
    document.querySelector("#fechaInicio").valueAsDate = firstDay;
    document.querySelector("#fechaFin").valueAsDate = now;
    mostrarDatosFacturasDeposito();
  });

  /*=============================================
    - MOSTRAR FACTURAS DEPOSITO
  =============================================*/

  async function mostrarDatosFacturasDeposito() {

    const fechaInicio = $("#fechaInicio").val();
    const fechaFin = $("#fechaFin").val();
    const datos = await cargarListadoFacturasDeposito({
      _fechaInicio: fechaInicio ? fechaInicio.concat(" 00:00:00") : undefined,
      _fechaFin: fechaFin ? fechaFin.concat(" 23:59:59") : undefined
    });

    const filas = Array.isArray(datos) ? datos.map((factura) => {
      return {
        id_factura: factura.id_factura,
        id_factura_deposito: factura.id_factura_deposito,
        factura: `${factura.serie_factura} - ${factura.numero_factura}`,
        fecha_deposito: factura.fecha_deposito,
        entidad_bancaria: factura.entidad_bancaria,
        forma_pago: factura.forma_pago,
        numero_centro: factura.numero_centro,
        numero_operacion: factura.numero_operacion,
        fecha_registro: factura.fecha_registro
      };
    }) : [];

    if (!tablaFacturas) {
      tablaFacturas = $("#tablaListado").DataTable({
        data: filas,
        columns: [
          { data: "factura", title: "FACTURA" },
          { data: "fecha_deposito", title: "FECHA DEPOSITO" },
          { data: "entidad_bancaria", title: "ENTIDAD BANCARIA" },
          { data: "forma_pago", title: "FORMA DE PAGO" },
          { data: "numero_centro", title: "NUMERO CENTRO" },
          { data: "numero_operacion", title: "NUMERO OPERACION" },
          { data: "fecha_registro", title: "FECHA REGISTRO" },
          {
            data: null,
            title: "ACCION",
            orderable: false,
            searchable: false,
            className: 'no-export',
            render: function (data, type, row) {
              if (type === 'display') {
                return `<button class='btn btn-sm btn-primary' onclick='ventanaFacturaDepositoEditar(${row.id_factura})'><i class='fas fa-edit'></i></button>`;
              }
              return '';
            }
          }
        ],
        dom: "Bfrtip",
        lengthMenu: [
          [10, 25, 50, -1],
          ["VER 10 FILAS", "VER 25 FILAS", "VER 50 FILAS", "TODO"],
        ],
        order: [[6, 'desc']],
        buttons: [
          {
            extend: "pageLength",
            text: "VER 10 FILAS",
          },
          {
            extend: "print",
            title: "LISTADO DEPOSITO",
            text: "IMPRIMIR",
            exportOptions: { columns: ':not(.no-export)', orthogonal: 'export' }
          },
          {
            extend: "pdfHtml5",
            download: "open",
            title: "LISTADO DEPOSITO",
            text: "EXPORTAR PDF",
            orientation: 'landscape',
            pageSize: 'A4',
            exportOptions: { columns: ':not(.no-export)', orthogonal: 'export' }
          },
        ],
      });
    } else {
      tablaFacturas.clear();
      if (filas.length) tablaFacturas.rows.add(filas);
      tablaFacturas.draw(false);
    }
  }

  /*=============================================
    - ABRIR MODAL EDITAR FACTURA DEPOSITO
  =============================================*/

  async function ventanaFacturaDepositoEditar(idFactura) {
    const datos = await cargarDepositoIdFactura({
      _idFactura: idFactura
    });

    $("#codigo").html(datos.id_factura);
    $("#deposito").html(datos.id_factura_deposito);
    $("#fechaDeposito").val(datos.fecha_deposito);
    $("#entidadBancaria").val(datos.entidad_bancaria);
    $("#formaPago").val(datos.forma_pago);
    $("#numeroCentro").val(datos.numero_centro);
    $("#numeroOperacion").val(datos.numero_operacion);
    $("#modalEditarFacturaDeposito").modal("show");
  }

  /*=============================================
    - VALIDAR FACTURA DEPOSITO - ACTUALIZAR
  =============================================*/

  async function validarFormularioActualizarDeposito() {
    const idFacturaDeposito = $("#deposito").html();
    const idFactura = $("#codigo").html();
    const fechaDeposito = $("#fechaDeposito").val();
    const entidadBancaria = $("#entidadBancaria").val();
    const formaPago = $("#formaPago").val();
    const numeroCentro = $("#numeroCentro").val();
    const numeroOperacion = $("#numeroOperacion").val();

    const datos = await actualizarDeposito({
      _idFacturaDeposito: idFacturaDeposito,
      _idFactura: idFactura,
      _fechaDeposito: fechaDeposito,
      _entidadBancaria: entidadBancaria,
      _formaPago: formaPago,
      _numeroCentro: numeroCentro,
      _numeroOperacion: numeroOperacion
    });

    if (datos.response === 0) {
      Swal.fire({
        icon: "error",
        title: "Deposito",
        text: datos.message
      });
    } else {
      $("#closeModal").click();
      await mostrarDatosFacturasDeposito();
      Swal.fire({
        icon: "success",
        title: "Deposito Actualizado",
        text: datos.message
      });
    }
  }


  // Función para exportar la tabla a Excel usando SheetJS
  function exportarExcel() {
    let data = [];
    let headers = [];
    // obtener headers visibles (sin .no-export)
    $('#tablaListado thead th').not('.no-export').each(function () {
      headers.push($(this).text());
    });
    data.push(headers);
    if (tablaFacturas) {
      const rows = tablaFacturas.rows({ search: 'applied' }).data().toArray();
      for (const row of rows) {
        const fila = exportColumnKeys.map(k => row[k] ?? '');
        data.push(fila);
      }
    }
    var ws = XLSX.utils.aoa_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Reporte");
    XLSX.writeFile(wb, "ReporteFacturasDeposito.xlsx");
  }
</script>
